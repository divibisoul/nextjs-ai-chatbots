name: N04 Lock Repair

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Synchronize lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Persist lockfile
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git commit -m 'fix: synchronize pnpm lockfile'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
