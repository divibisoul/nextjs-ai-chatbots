name: N04 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  n04:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable pnpm
        run: corepack enable
      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: N04 tests
        run: pnpm run test:n04
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm run build
