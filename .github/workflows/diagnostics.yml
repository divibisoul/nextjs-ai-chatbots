name: N03 validation diagnostics
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_VERSION: '22'
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: FIRST EXECUTION STEP - capture runner state
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/n03-first-step"
          { date -u; uname -a || true; cat /etc/os-release || true; node --version || true; npm --version || true; command -v bun || true; bun --version || true; df -hT || true; free -h || true; env | cut -d= -f1 | sort || true; } 2>&1 | tee "$RUNNER_TEMP/n03-first-step/runner.log"
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify toolchain
        run: node --version && bun --version
      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Lint
        run: bun run lint
      - name: N04 real test suite
        run: bun run test:n04
      - name: Emergency diagnostics
        if: failure()
        run: bun scripts/diagnostics.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n03-diagnostics-${{ github.run_id }}
          path: .diagnostics/
          if-no-files-found: ignore
          retention-days: 14
