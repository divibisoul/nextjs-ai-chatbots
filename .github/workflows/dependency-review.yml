name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate dependency lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Audit high severity dependencies
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level high > pnpm-audit.txt 2>&1
          audit_status=$?
          cat pnpm-audit.txt
          if [ "$audit_status" -eq 0 ]; then
            echo "SECURITY_AUDIT: PASS"
            exit 0
          fi
          node scripts/validate-pnpm-audit-gate.mjs pnpm-audit.txt

      - name: Upload security audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n04-security-audit-${{ github.run_id }}
          path: pnpm-audit.txt
          if-no-files-found: error
