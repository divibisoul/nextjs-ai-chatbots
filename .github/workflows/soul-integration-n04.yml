name: SOUL Integration CI - N04
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
        with:
          submodules: false
      - name: Validate SOUL identity
        run: test -s SOUL_ECOSYSTEM.md
      - name: Validate submodules
        shell: bash
        run: |
          set -e
          if test -f .gitmodules; then
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | while read p; do test -e "$p"; done
          fi

      - name: Validate N04 25-source fabric
        run: |
          python3 - <<'PY'
          import json
          m=json.load(open('integrations/soul-25-augmentation.json'))
          assert m['external_provider_count'] == 25
          assert len(m['external_providers']) == 25
          assert m['soul_peer_count'] == 9
          assert m['component_id'] == 'N04'
          print('N04 SOUL-34 / 25-UPSTREAM FABRIC: PASS')
          PY
      - name: N04 capability fabric and Browser-Use tests
        run: pnpm run test:n04 -- --test-only
