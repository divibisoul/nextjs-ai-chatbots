name: Soul Mesh CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck N04 hybrid Mesh runtime
        run: pnpm exec tsc -p tsconfig.mesh.json --noEmit
      - name: Run N04 Mesh contract tests
        run: pnpm run test:n04
      - name: Build N04 web runtime
        run: pnpm run build
