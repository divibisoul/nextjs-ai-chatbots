name: Soul Mesh CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck N04 hybrid Mesh runtime
        run: pnpm exec tsc -p tsconfig.mesh.json --noEmit
      - name: Run N04 Mesh contract tests
        run: pnpm run test:n04
      - name: Run N04 HMAC boundary tests
        run: pnpm run test:mesh:hmac

  live-peer-e2e:
    name: N03↔N04 bidirectional real-process E2E
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/n03-n04-real-process-e2e.yml
